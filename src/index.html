  <script>
    (function () {
      var q = window.location.search;
      if (q && q.slice(0, 3) === '?p=') {
        var params = q.slice(1).split('&').reduce(function (o, s) {
          var kv = s.split('='); o[kv[0]] = decodeURIComponent(kv[1] || ''); return o;
        }, {});
        window.history.replaceState(null, null,
          '/' + params['p'] + (params['q'] ? '?' + params['q'] : '') + window.location.hash
        );
      }
    }());
  </script>
